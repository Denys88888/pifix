<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PiFix">
  <!-- Same geometry as scripts/makeIcons.py, at 1/16 scale. Change both. -->
  <rect width="64" height="64" rx="14" fill="#1a1a2e"/>
  <g transform="rotate(-45 32 32)" fill="none" stroke="#4caf50">
    <!-- Ring with a 62° jaw at the top. -->
    <path d="M35.7984 17.8659A7.375 7.375 0 1 1 28.2016 17.8659" stroke-width="4.75"/>
